services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # Emulates Upstash's REST API on top of the plain Redis container above,
  # so @upstash/redis (used in src/lib/redis.ts) works unchanged in local dev.
  redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: local_dev_token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      - redis

volumes:
  redis-data:
